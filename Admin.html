<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Inscriptions OBS Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080d;--surface:#161622;--surface-2:#1e1e2f;--border:#2a2a44;--text:#f5f5ff;--muted:#9aa0b6;--accent:#8b5cf6;--accent-2:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;padding:24px}
.header{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 24px;border-bottom:1px solid var(--border);padding-bottom:16px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700}
.logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1100px;margin:0 auto 24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.stat b{font-size:28px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.table-wrap{max-width:1100px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:13px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
input.search{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:10px 16px;color:white;min-width:240px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 16px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
td{padding:14px 16px;border-bottom:1px solid rgba(42,42,68,0.5)}
tr:hover td{background:rgba(139,92,246,0.05)}
.badge{background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.3);padding:4px 10px;border-radius:999px;font-size:11px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr} table{font-size:12px} .toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">OBS</div> Admin Inscriptions</div>
  <div style="display:flex;gap:8px">
    <a href="index.html" class="btn btn-ghost">← Formulaire</a>
    <button class="btn btn-primary" type="button" onclick="exportCSV()">📥 Export Excel/CSV</button>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="table-wrap">
  <div class="toolbar">
    <div class="badge" id="countBadge">0 inscription</div>
    <input id="searchInput" class="search" type="search" placeholder="Rechercher..." aria-label="Rechercher une inscription">
  </div>
  <div id="tableContainer"></div>
</div>

<script>
  const STORAGE_KEY = 'obs_inscriptions';

  function getInscriptions() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch (error) {
      console.error('Erreur lecture localStorage', error);
      return [];
    }
  }

  function escapeHtml(value = '') {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDate(dateString) {
    if (!dateString) return '—';
    const date = new Date(dateString);
    if (Number.isNaN(date.getTime())) return '—';
    return new Intl.DateTimeFormat('fr-FR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }).format(date);
  }

  function getLevelLabel(value) {
    const labels = {
      debutant: 'Débutant',
      intermediaire: 'Intermédiaire',
      avance: 'Avancé',
      formateur: 'Futur formateur',
      'preparation-studio': 'Prépare mon studio'
    };
    return labels[value] || value || '—';
  }

  function renderStats() {
    const items = getInscriptions();
    const stats = document.getElementById('stats');
    const niveau = { debutant: 0, intermediaire: 0, avance: 0, formateur: 0, 'preparation-studio': 0 };

    items.forEach((item) => {
      if (niveau[item.niveau] !== undefined) niveau[item.niveau] += 1;
    });

    stats.innerHTML = `
      <div class="stat"><b>${items.length}</b><span>Total</span></div>
      <div class="stat"><b>${niveau.debutant}</b><span>Débutants</span></div>
      <div class="stat"><b>${niveau.intermediaire}</b><span>Interméd.</span></div>
      <div class="stat"><b>${niveau.avance + niveau.formateur + niveau['preparation-studio']}</b><span>Confirmés</span></div>
    `;
  }

  function renderTable(query = '') {
    const items = getInscriptions();
    const search = query.trim().toLowerCase();
    const filtered = items.filter((item) => {
      if (!search) return true;
      return [item.nom, item.email, item.ville, item.whatsapp, item.niveau, item.objectifs, item.dispo, item.message]
        .join(' ')
        .toLowerCase()
        .includes(search);
    });

    const countBadge = document.getElementById('countBadge');
    countBadge.textContent = `${filtered.length} inscription${filtered.length > 1 ? 's' : ''}`;

    const tableContainer = document.getElementById('tableContainer');
    if (!filtered.length) {
      tableContainer.innerHTML = '<div class="empty">Aucune inscription trouvée.</div>';
      return;
    }

    const rows = filtered.map((item, index) => `
      <tr>
        <td>${index + 1}</td>
        <td>${escapeHtml(item.nom || '—')}</td>
        <td>${escapeHtml(item.whatsapp || '—')}</td>
        <td>${escapeHtml(item.email || '—')}</td>
        <td>${escapeHtml(item.ville || '—')}</td>
        <td>${escapeHtml(getLevelLabel(item.niveau))}</td>
        <td>${escapeHtml(item.objectifs || '—')}</td>
        <td>${escapeHtml(item.dispo || '—')}</td>
        <td>${escapeHtml(item.message || '—')}</td>
        <td>${escapeHtml(formatDate(item.date))}</td>
      </tr>
    `).join('');

    tableContainer.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nom</th>
            <th>WhatsApp</th>
            <th>Email</th>
            <th>Ville</th>
            <th>Niveau</th>
            <th>Objectifs</th>
            <th>Disponibilité</th>
            <th>Projet</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function exportCSV() {
    const items = getInscriptions();
    if (!items.length) {
      alert('Aucune inscription à exporter.');
      return;
    }

    const headers = ['Nom', 'WhatsApp', 'Email', 'Ville', 'Niveau', 'Objectifs', 'Disponibilite', 'Projet', 'Date'];
    const rows = items.map((item) => [
      item.nom || '',
      item.whatsapp || '',
      item.email || '',
      item.ville || '',
      getLevelLabel(item.niveau),
      item.objectifs || '',
      item.dispo || '',
      item.message || '',
      formatDate(item.date)
    ]);

    const csv = [headers, ...rows]
      .map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(';'))
      .join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'inscriptions-obs-studio.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  window.exportCSV = exportCSV;

  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('searchInput');
    if (input) {
      input.addEventListener('input', (event) => renderTable(event.target.value));
    }
    renderStats();
    renderTable();
  });
</script>
</body>
</html>
